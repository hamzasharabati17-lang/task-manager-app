<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow | Task Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="app-header">
      <div>
        <p class="eyebrow">PRODUCTIVITY</p>
        <h1>TaskFlow</h1>
        <p class="subtitle">Organize your day. Get things done.</p>
      </div>
    </header>

    <section class="task-input">
      <input
        type="text"
        id="taskInput"
        placeholder="What needs to be done?"
        autocomplete="off"
      >

      <button id="addTaskBtn">Add Task</button>
    </section>

    <section class="stats">
      <div class="stat">
        <span id="totalTasks">0</span>
        <small>Total</small>
      </div>

      <div class="stat">
        <span id="completedTasks">0</span>
        <small>Completed</small>
      </div>

      <div class="stat">
        <span id="remainingTasks">0</span>
        <small>Remaining</small>
      </div>
    </section>

    <section class="tasks-section">

      <div class="section-title">
        <h2>My Tasks</h2>
        <button id="clearCompleted">Clear completed</button>
      </div>

      <ul id="taskList"></ul>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✓</div>
        <h3>No tasks yet</h3>
        <p>Add your first task to get started.</p>
      </div>

    </section>

  </main>

  <footer>
    <p>TaskFlow — Personal Portfolio Project</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
